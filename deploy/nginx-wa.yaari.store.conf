# Public address only for the QR page (to link the phone from a browser) and the health check.
# Apps on this server send messages straight to http://127.0.0.1:3100, not through here.
#
# Install once (after the DNS record for wa.yaari.store points to this server):
#   sudo cp deploy/nginx-wa.yaari.store.conf /etc/nginx/sites-available/wa-gateway
#   sudo ln -s /etc/nginx/sites-available/wa-gateway /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wa.yaari.store

server {
    listen 80;
    server_name wa.yaari.store;

    location ~ ^/(qr/[\w-]+|health)$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sending is not open to the internet.
    location / {
        return 404;
    }
}
